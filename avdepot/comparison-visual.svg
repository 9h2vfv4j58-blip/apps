<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">Vergleich von Altersvorsorgedepot, Basisrente und Privatrente</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#eef3f6"/></linearGradient></defs><rect width="1000" height="620" rx="36" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="74" y="84" font-size="24" font-weight="700" fill="#193248">Vorsorgewege im Vergleich</text><text x="74" y="118" font-size="15" fill="#6f7c87">Unterschiede strukturiert sichtbar machen</text><g transform="translate(74 170)"><rect width="852" height="94" rx="20" fill="#fff" stroke="#dfe5e9"/><circle cx="44" cy="47" r="17" fill="#315a78"/><text x="80" y="39" font-size="18" font-weight="700" fill="#193248">Altersvorsorgedepot</text><text x="80" y="64" font-size="14" fill="#6f7c87">Förderung · Flexibilität · Kapitalphase</text><rect x="630" y="33" width="154" height="28" rx="14" fill="#e8eff4"/><text x="707" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#315a78">gefördert</text></g><g transform="translate(74 284)"><rect width="852" height="94" rx="20" fill="#fff" stroke="#dfe5e9"/><circle cx="44" cy="47" r="17" fill="#c89b3c"/><text x="80" y="39" font-size="18" font-weight="700" fill="#193248">Basisrente</text><text x="80" y="64" font-size="14" fill="#6f7c87">Steuerwirkung · Bindung · lebenslange Rente</text><rect x="630" y="33" width="154" height="28" rx="14" fill="#f5eddd"/><text x="707" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#9d7529">steuerlich</text></g><g transform="translate(74 398)"><rect width="852" height="94" rx="20" fill="#fff" stroke="#dfe5e9"/><circle cx="44" cy="47" r="17" fill="#8d98a3"/><text x="80" y="39" font-size="18" font-weight="700" fill="#193248">Fondsgebundene Privatrente</text><text x="80" y="64" font-size="14" fill="#6f7c87">